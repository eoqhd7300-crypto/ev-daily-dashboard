</head>
<body class="min-h-screen pb-16">

    <!-- Application JavaScript Logic -->
    <script>
        // Dynamic Date Helper (Threshold: 09:00 AM Daily) - kept in sync with index.html
        window.getTargetReportDate = function() {
            const now = new Date();
            if (now.getHours() < 9) {
                now.setDate(now.getDate() - 1);
            }
            return now;
        };

        window.formatDateISO = function(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        };

        window.getOffsetISO = function(baseDate, dayOffset) {
            const d = new Date(baseDate);
            d.setDate(d.getDate() + dayOffset);
            return window.formatDateISO(d);
        };

        // Built-in Fallback News Dataset (used only if data.json is unavailable, e.g. opened via file://)
        window.generateEVNewsData = function(baseDate) {
            const d0 = window.getOffsetISO(baseDate, 0);
            const d1 = window.getOffsetISO(baseDate, -1);
            const d2 = window.getOffsetISO(baseDate, -2);
            const d3 = window.getOffsetISO(baseDate, -3);
            const d4 = window.getOffsetISO(baseDate, -4);
            const d5 = window.getOffsetISO(baseDate, -5);

                { id: 9, title: "Mercedes-Benz GLA Electric arrives in Europe with MMA platform", summary: "메르세데스-벤츠가 차세대 전동화 모듈러 플랫폼 MMA 기반의 컴팩트 순전기 SUV GLA Electric 3개 트림의 사양과 가격을 유럽 공시했습니다.", source: "EVSpecifications", date: d4, url: "https://www.evspecifications.com/news/" },

                { id: 11, title: "China sets new accuracy rules for EV battery health reading with 5% error limit", summary: "중국 공신부(MIIT)가 중고 전기차 거래 및 점검 표준화를 위해 BMS 배터리 잔존 수명(SOH) 측정 오차 범위를 5% 이내로 엄격 규제하는 규칙을 시행했습니다.", source: "CarNewsChina", date: d5, url: "https://carnewschina.com" },
                { id: 12, title: "享界 G9 顶帐版帐篷内部什么样？官方预告 能越野/能露营让人心动", summary: "화웨이 HIMA-BAIC 합작 브랜드 스텔라토(享界)가 파노라믹 루프 및 더블 텐트 캠핑 구조를 갖춘 G9 럭셔리 EV SUV 특화 트림을 선보였습니다.", source: "Autohome", date: d5, url: "https://ev.autohome.com.cn" },
                { id: 13, title: "CATL Shenxing 5C LFP Battery Powering Zeekr 7X Achieves 10.5 Min Charge", summary: "CATL의 초고속 5.5C LFP 신싱 셀을 탑재한 지커(Zeekr) 7X가 SOC 10%에서 80%까지 단 10분 30초 만에 충전을 완료했습니다.", source: "Gasgoo Auto", date: d5, url: "https://autonews.gasgoo.com" },
                { id: 14, title: "BMW Gen6 Cylindrical Cell CTC Pack Production Line Active in Dingolfing", summary: "BMW 그룹이 노이에 클라세(Neue Klasse) 시리즈에 적용되는 6세대 46mm 원통형 CTC 배터리 팩 정밀 생산 라인을 가동했습니다.", source: "EVKX Knowledge", date: d5, url: "https://evkx.net" },
                { id: 15, title: "Nio Onvo L60 900V Battery Swap Station Network Surpasses 3,000 Outlets", summary: "니오(Nio)의 락도(Onvo) L60 전용 900V 초고속 3분 자동 배터리 스왑 교환소 구축 수량이 중국 전역 3,000개소를 돌파했습니다.", source: "CNEVPost", date: d5, url: "https://cnevpost.com" },

                { id: 18, title: "Chery Exlantix ET Demonstrates 9-Min Extreme Fast Charging at -20°C", summary: "체리자동차 엑스란티스(Exlantix) ET가 영하 20도 극저온 조건에서 CATL 신싱 LFP 셀 기반 9분 급속 충전을 성공적으로 정밀 시연했습니다.", source: "CarNewsChina", date: d5, url: "https://carnewschina.com" },
                { id: 19, title: "Yutong YTEA Electric Bus Architecture Guarantees 1.5M Km Battery Durability", summary: "우퉁(Yutong) 버스가 CATL 상용 셀 기반 YTEA 전동화 플랫폼을 적용해 15년 150만km 내구성 보증을 발표했습니다.", source: "Gasgoo Commercials", date: d5, url: "https://autonews.gasgoo.com" },
                { id: 20, title: "Tesla Model Y Juniper Refresh NVH & Suspension Enhancements Production Underway", summary: "테슬라 모델 Y 주니퍼(Juniper) 페이스리프트 모델이 서스펜션 정숙성과 실내 NVH 차음재 강화를 거쳐 정식 출고를 시작했습니다.", source: "Electrek", date: d5, url: "https://electrek.co" }
            ];
        };

        window.renderNewsList = function(newsData) {
            const container = document.getElementById('newsListContainer');
            if (!container) return;
            container.innerHTML = '';

            newsData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = "bg-slate-50 hover:bg-slate-100/90 p-4 rounded-xl border border-slate-200 transition space-y-2";
                const isSearchLink = item.linkType === 'search';
                const linkLabel = isSearchLink ? '🔎 관련 기사 검색결과 보기' : '🔗 뉴스 원본 기사 열람하기';
                card.innerHTML = `
                    <div class="flex items-center justify-between gap-2">
                        <div class="flex items-center space-x-2 min-w-0">
                            <span class="bg-sky-600 text-white text-xs font-bold px-2 py-0.5 rounded-md flex-shrink-0">NO. ${index + 1}</span>
                            <span class="text-sm font-bold text-slate-500 bg-white border border-slate-200 px-2 py-0.5 rounded-md flex-shrink-0">${item.source}</span>
                            <span class="text-sm font-bold text-slate-900 truncate">${item.title}</span>
                        </div>
                        <span class="text-xs font-semibold text-slate-400 flex-shrink-0">${item.date}</span>
                    </div>
                    <p class="text-sm text-slate-600 leading-relaxed font-normal line-clamp-2">${item.summary}</p>
                    <div class="flex justify-end pt-1">
                        <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center space-x-1 text-sm font-bold text-sky-600 hover:text-sky-800 hover:underline">
                            <span>${linkLabel}</span>
                            <span>➔</span>
                        </a>
                    </div>
                `;
                container.appendChild(card);
            });
        };

        // Initialize: render built-in fallback data first, then overlay with data.json if available
        window.addEventListener('DOMContentLoaded', async () => {
            const activeReportDate = window.getTargetReportDate();
            let newsData = window.generateEVNewsData(activeReportDate);
            window.renderNewsList(newsData);

            try {
                const res = await fetch('./data.json', { cache: 'no-store' });
                if (res.ok) {
                    const data = await res.json();
                    if (Array.isArray(data.news) && data.news.length > 0) {
                        window.renderNewsList(data.news);
                    }
                }
            } catch (err) {
                console.warn('[EV News] data.json을 불러오지 못해 내장 데이터로 표시합니다.', err);
            }
        });
    </script>
</body>
</html>
