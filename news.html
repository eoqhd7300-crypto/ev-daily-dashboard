<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV News | Daily EV & 배터리 플랫폼 대시보드</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#035485',
                            900: '#0f172a'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            /* Sustained pale sky-blue wash (Palette 2, matches index.html + the site's sky-600
               brand accent) for visual impact and site-wide consistency. */
            background: linear-gradient(180deg, #7dd3fc 0px, #e0f2fe 200px, #e0f2fe 100%);
            color: #0f172a;
        }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body class="min-h-screen pb-16">

    <!-- Header Navigation Bar (동일 구성, 현재 페이지인 EV News 메뉴만 활성 표시) -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-2">
            <a href="index.html" class="flex items-center space-x-3">
                <div class="bg-sky-600 text-white p-2 rounded-lg font-bold text-xl flex items-center justify-center w-10 h-10 shadow-sm">
                    ⚡
                </div>
                <div>
                    <h1 class="font-bold text-slate-900 text-lg sm:text-xl leading-tight">Daily EV & Battery Intelligence News</h1>
                    <p class="text-xs text-slate-500 font-medium"> by BTI Team </p>
                </div>
            </a>

            <!-- 로고와 상단 메뉴 사이 빈 공간에 배치되는 마스코트 일러스트 (좋은 화면에서는 숨김) -->
            <img src="./assets/images/mascot_road_trip.png" alt="EV 로드트립 마스코트" class="hidden md:block h-14 w-auto object-contain flex-shrink-0 select-none pointer-events-none">

            <nav class="flex items-center space-x-1 sm:space-x-2 flex-wrap justify-end">
                <a href="index.html" class="px-3 py-1.5 text-xs sm:text-sm font-semibold rounded-lg text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition">Home</a>
                <a href="index.html" class="px-3 py-1.5 text-xs sm:text-sm font-semibold rounded-lg text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition">기본사양비교</a>
                <a href="teardown.html" class="px-3 py-1.5 text-xs sm:text-sm font-semibold rounded-lg text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition">Teardown Data</a>
                <a href="news.html" class="px-3 py-1.5 text-xs sm:text-sm font-semibold rounded-lg bg-sky-50 text-sky-700 border border-sky-200 transition">EV News</a>
                <select class="px-3 py-1.5 text-xs sm:text-sm font-semibold rounded-lg border border-slate-300 bg-white text-slate-600 hover:bg-slate-100 transition cursor-pointer">
                    <option>Others</option>
                    <option>Data web Source</option>
                </select>
            </nav>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6">

        <div class="flex items-center justify-between mb-5 flex-wrap gap-2">
            <div>
                <h2 id="newsPageTitle" class="text-lg sm:text-xl font-bold text-slate-900 flex items-center gap-2">
                    <span>📰 글로벌 EV 최신 기사 브리핑</span>
                    <span class="text-xs font-normal text-sky-700 bg-sky-50 border border-sky-200 px-2 py-0.5 rounded-md">Daily update</span>
                </h2>
                <p id="newsPageSubtitle" class="text-xs text-slate-500 mt-0.5">글로벌 전기차, 배터리, 완성차 기술 동향 헤드라인을 요약 정리했습니다. 원본 링크를 클릭하면 출처 페이지로 이동합니다.</p>
            </div>
            <a href="index.html" class="text-xs font-bold px-3 py-1.5 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 transition flex items-center gap-1 whitespace-nowrap">
                <span>◀ 메인 페이지로 돌아가기</span>
            </a>
        </div>

        <!-- 국내기사 / 중국기사 선택 탭 (메인 페이지 폼팩터/조성 선택 버튼과 동일한 스타일) -->
        <div class="flex items-center gap-1.5 mb-4">
            <button id="newsTab_domestic" data-tab="domestic" onclick="window.setNewsTab('domestic')" class="news-tab-btn px-3 py-1.5 text-xs sm:text-sm font-bold rounded-lg border border-sky-600 bg-sky-600 text-white shadow-xs transition">
                🌐 국내기사
            </button>
            <button id="newsTab_china" data-tab="china" onclick="window.setNewsTab('china')" class="news-tab-btn px-3 py-1.5 text-xs sm:text-sm font-bold rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-sky-50 transition">
                🌐 중국기사
            </button>
        </div>

        <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 mb-8">
            <div id="newsListContainer" class="space-y-3">
                <p class="text-sm text-slate-400 text-center py-8">뉴스를 불러오는 중입니다...</p>
            </div>
        </section>
    </main>

    <!-- Application JavaScript Logic -->
    <script>
        let domesticNewsData = [];
        let chinaNewsDataAll = [];
        let activeNewsTab = 'domestic'; // 'domestic' | 'china' - 두 기사 출처를 섞지 않고 탭으로 분리

        window.renderNewsList = function(newsData, badgeClass) {
            const container = document.getElementById('newsListContainer');
            if (!container) return;
            container.innerHTML = '';
            const badge = badgeClass || 'bg-sky-600';

            if (!newsData || newsData.length === 0) {
                container.innerHTML = '<p class="text-sm text-slate-400 text-center py-8">표시할 뉴스가 없습니다.</p>';
                return;
            }

            newsData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = "bg-slate-50 hover:bg-slate-100/90 p-4 rounded-xl border border-slate-200 transition space-y-2";
                const isSearchLink = item.linkType === 'search';
                const linkLabel = isSearchLink ? '🔎 관련 기사 검색결과 보기' : '🔗 뉴스 원본 기사 열람하기';
                card.innerHTML = `
                    <div class="flex items-center justify-between gap-2">
                        <div class="flex items-center space-x-2 min-w-0">
                            <span class="${badge} text-white text-xs font-bold px-2 py-0.5 rounded-md flex-shrink-0">NO. ${index + 1}</span>
                            <span class="text-sm font-bold text-slate-900 truncate">${item.title}</span>
                        </div>
                        <span class="text-xs font-semibold text-slate-400 flex-shrink-0">${item.date}</span>
                    </div>
                    <p class="text-sm text-slate-600 leading-relaxed font-normal line-clamp-2">${item.summary}</p>
                    <div class="flex justify-end pt-1">
                        <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center space-x-1 text-sm font-bold text-sky-600 hover:text-sky-800 hover:underline">
                            <span>${linkLabel}</span>
                            <span>➔</span>
                        </a>
                    </div>
                `;
                container.appendChild(card);
            });
        };

        // 국내기사/중국기사 탭 전환: 두 출처를 한 목록에 섞지 않고 선택한 쪽만 렌더링한다.
        window.setNewsTab = function(tab) {
            activeNewsTab = tab;

            document.querySelectorAll('.news-tab-btn').forEach(btn => {
                const isActive = btn.dataset.tab === tab;
                btn.className = isActive
                    ? "news-tab-btn px-3 py-1.5 text-xs sm:text-sm font-bold rounded-lg border border-sky-600 bg-sky-600 text-white shadow-xs transition"
                    : "news-tab-btn px-3 py-1.5 text-xs sm:text-sm font-bold rounded-lg border transition border-slate-200 bg-white text-slate-600 hover:bg-sky-50";
            });

            const titleEl = document.getElementById('newsPageTitle');
            const subtitleEl = document.getElementById('newsPageSubtitle');
            if (tab === 'china') {
                if (titleEl) titleEl.innerHTML = '<span>📰 China EV 최신 기사 브리핑</span><span class="text-xs font-normal text-rose-700 bg-rose-50 border border-rose-200 px-2 py-0.5 rounded-md">오전 9시 자동 갱신</span>';
                if (subtitleEl) subtitleEl.innerText = 'CnEVPost · CarNewsChina RSS 기반 중국 전기차/배터리 산업 동향입니다. 원본 링크를 클릭하면 출처 페이지로 이동합니다.';
                window.renderNewsList(chinaNewsDataAll, 'bg-rose-600');
            } else {
                if (titleEl) titleEl.innerHTML = '<span>📰 글로벌 EV 최신 기사 브리핑</span><span class="text-xs font-normal text-sky-700 bg-sky-50 border border-sky-200 px-2 py-0.5 rounded-md">오전 9시 자동 갱신</span>';
                if (subtitleEl) subtitleEl.innerText = '글로벌 전기차, 배터리, 완성차 기술 동향 헤드라인을 요약 정리했습니다. 원본 링크를 클릭하면 출처 페이지로 이동합니다.';
                window.renderNewsList(domesticNewsData, 'bg-sky-600');
            }
        };

        // Initialize: fetch the real (data.json) news list. No hardcoded fallback dataset is
        // rendered anymore (it used to flash foreign/Chinese placeholder articles briefly before
        // being replaced by real data on every refresh) - only actual collected news is shown.
        // URL의 ?tab=china 파라미터로 진입하면(메인 페이지 China 카드의 "전체 뉴스 보기" 링크) 중국기사 탭이
        // 기본 선택된다.
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('./data.json', { cache: 'no-store' });
                if (res.ok) {
                    const data = await res.json();
                    domesticNewsData = Array.isArray(data.news) ? data.news : [];
                    chinaNewsDataAll = Array.isArray(data.chinaNews) ? data.chinaNews : [];
                }
            } catch (err) {
                console.warn('[EV News] data.json을 불러오지 못했습니다.', err);
            }

            const requestedTab = new URLSearchParams(window.location.search).get('tab');
            window.setNewsTab(requestedTab === 'china' ? 'china' : 'domestic');
        });
    </script>
</body>
</html>
