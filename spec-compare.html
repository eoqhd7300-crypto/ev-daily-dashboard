<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기본사양비교 | Daily EV & 배터리 플랫폼 대시보드</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#035485',
                            900: '#0f172a'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            /* Subtle top fade, matching the same slate ramp used on the video hero page (index.html)
               for visual consistency across the site, without a dark video tone to fade from. */
            background: linear-gradient(180deg, #e2e8f0 0px, #f1f5f9 160px, #f8fafc 320px, #f8fafc 100%);
            color: #0f172a;
        }
    </style>
</head>
<body class="min-h-screen pb-16">

    <!-- Header Navigation Bar (동일 구성, 현재 페이지인 기본사양비교만 강조) -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-2">
            <a href="index.html" class="flex items-center space-x-3">
                <div class="bg-sky-600 text-white p-2 rounded-lg font-bold text-xl flex items-center justify-center w-10 h-10 shadow-sm">
                    ⚡
                </div>
                <div>
                    <h1 class="font-bold text-slate-900 text-lg sm:text-xl leading-tight">Daily EV & Battery Intelligence News</h1>
                    <p class="text-xs text-slate-500 font-medium"> by BTI Team </p>
                </div>
            </a>

            <nav class="flex items-center space-x-1 sm:space-x-2 flex-wrap justify-end">
                <a href="index.html" class="px-3 py-1.5 text-xs sm:text-sm font-semibold rounded-lg text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition">New EV Models</a>
                <a href="spec-compare.html" class="px-3 py-1.5 text-xs sm:text-sm font-semibold rounded-lg bg-sky-50 text-sky-700 border border-sky-200 transition">기본사양비교</a>
                <a href="teardown.html" class="px-3 py-1.5 text-xs sm:text-sm font-semibold rounded-lg text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition">Teardown Data</a>
                <a href="news.html" class="px-3 py-1.5 text-xs sm:text-sm font-semibold rounded-lg text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition">EV News</a>
                <select onchange="if (this.value === 'data_web_source') { window.location.href = 'data-web-source.html'; }" class="px-3 py-1.5 text-xs sm:text-sm font-semibold rounded-lg border border-slate-300 bg-white text-slate-600 hover:bg-slate-100 transition cursor-pointer">
                    <option value="">Others</option>
                    <option value="data_web_source">Data web Source</option>
                </select>
            </nav>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-[96vw] mx-auto px-4 sm:px-6 lg:px-8 pt-6">

        <div class="flex items-center justify-between mb-5 flex-wrap gap-2">
            <div>
                <h2 class="text-lg sm:text-xl font-bold text-slate-900 flex items-center gap-2">
                    <span>🔋 배터리 스펙 기본 정보표 (선택 차량 비교)</span>
                </h2>
                <p class="text-xs sm:text-sm text-slate-500 mt-0.5">메인 페이지 상단 표에서 체크한 차량들의 배터리 팩/셀 기본 정보를 나란히 비교합니다. 데이터가 없는 항목은 '-'로 표기됩니다.</p>
                <p class="text-[11px] sm:text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-lg px-2.5 py-1 mt-2 inline-flex items-center gap-1">
                    <span>⚠️ 미검증</span> 배지가 붙은 값은 공식 보도자료가 아닌 AI 학습 지식 기반 추정치입니다 (실시간 교차검증 안 됨). 참고용으로만 활용하세요.
                </p>
            </div>
            <a href="index.html" class="text-xs font-bold px-3 py-1.5 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 transition flex items-center gap-1 whitespace-nowrap">
                <span>◀ 메인 페이지로 돌아가기</span>
            </a>
        </div>

        <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 mb-8">
            <div id="specCompareContainer" class="overflow-auto">
                <!-- Dynamic Comparison Table Rendered via JS -->
            </div>
        </section>
    </main>

    <!-- Application JavaScript Logic -->
    <script>
        // '기본양식.pptx' 스타일 배터리 스펙 비교표 항목 정의 (데이터가 없으면 '-' 표기)
        // tier: 2 로 표시된 항목은 공식 자료가 아닌 AI 추정치(미검증)로, 값이 있을 때 배지를 함께 표시함
        const SPEC_COMPARE_ROWS = [
            { label: '차량사진', get: v => v.imageUrl ? `<img src="${v.imageUrl}" alt="${v.name}" class="w-full h-20 object-cover rounded-lg mx-auto">` : '-' },
            { label: '모델', get: v => v.name || '-' },
            { label: 'Trim', get: v => v.trim || '-' },
            { label: '출시일', get: v => v.releaseDate || '-' },
            { label: 'Pack 에너지', get: v => v.packEnergy || v.batterySpec || '-' },
            { label: '최대 출력', get: v => v.maxOutput || '-' },
            { label: '주행거리', get: v => v.rangePerformance || '-' },
            { label: '최대속도', get: v => v.topSpeed || '-' },
            { label: '0-100', get: v => v.zeroToHundred || '-' },
            { label: '가격', get: v => v.priceKRW || '-' },
            { label: '급속충전', get: v => v.qcPerformance || '-' },
            { label: 'Max 충전출력', get: v => v.maxChargePower || '-' },
            { label: 'Pack 제조사', get: v => v.packMaker || '-' },
            { label: 'Pack 타입', get: v => v.packType || '-' },
            { label: 'Cell 제조사', get: v => v.cellMaker || '-' },
            { label: 'Cell 타입', get: v => v.cellType || '-' },
            { label: '팩 공칭 전압', get: v => v.packVoltage || '-' },
            { label: '팩 용량 (Nom.)', get: v => v.packCapacityAh || '-', tier: 2 },
            { label: '팩 치수', get: v => v.packDimensions || '-', tier: 2 },
            { label: '팩 중량', get: v => v.packWeight || '-', tier: 2 },
            { label: '팩-Cell 중량', get: v => v.packMinusCellWeight || '-', tier: 2 },
            { label: 'Cell/Pack 중량', get: v => v.cellToPackWeightRatio || '-', tier: 2 },
            { label: '팩 ED', get: v => v.packEnergyDensity || '-', tier: 2 },
            { label: '셀 구성', get: v => v.cellConfiguration || '-', tier: 2 },
            { label: 'Cell 에너지 (Nom.)', get: v => v.cellEnergy || '-', tier: 2 },
            { label: 'Cell 용량 (Nom.)', get: v => v.cellCapacityAh || '-', tier: 2 },
            { label: 'Cell 조성', get: v => v.cellComposition || '-', tier: 2 },
            { label: 'Cell 치수 (실측)', get: v => v.cellDimensionsMeasured || '-', tier: 2 },
            { label: 'Cell 중량 (실측)', get: v => v.cellWeightMeasured || '-', tier: 2 },
            { label: 'Cell ED (Nominal)', get: v => v.cellEnergyDensity || '-', tier: 2 },
            { label: '냉각 방식', get: v => v.coolingMethod || '-' },
        ];

        window.renderSpecCompareTable = function(selectedVehicles) {
            const container = document.getElementById('specCompareContainer');

            if (!selectedVehicles || selectedVehicles.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 text-slate-500 text-sm">
                        비교할 차량이 선택되지 않았습니다.<br>
                        <a href="index.html" class="text-sky-600 font-bold hover:underline">메인 페이지</a>에서 상단 표의 체크박스로 비교할 차량을 먼저 선택해 주세요.
                    </div>
                `;
                return;
            }

            const headerCells = selectedVehicles.map(v => `
                <th class="p-3 bg-indigo-50 text-indigo-900 font-bold text-xs sm:text-sm border border-slate-200 min-w-[180px] whitespace-nowrap">${v.name}</th>
            `).join('');

            const unverifiedBadge = '<span class="inline-flex items-center gap-0.5 text-[9px] font-bold text-amber-700 bg-amber-50 border border-amber-200 px-1.5 py-0.5 rounded-full whitespace-nowrap mt-1">⚠️ 미검증</span>';

            const bodyRows = SPEC_COMPARE_ROWS.map(row => `
                <tr class="even:bg-slate-50">
                    <td class="p-3 font-bold text-slate-700 bg-slate-100 border border-slate-200 text-xs sm:text-sm whitespace-nowrap sticky left-0">${row.label}</td>
                    ${selectedVehicles.map(v => {
                        const val = row.get(v);
                        const showBadge = row.tier === 2 && val && val !== '-';
                        return `<td class="p-3 text-center text-xs sm:text-sm text-slate-800 border border-slate-200">
                            <div class="flex flex-col items-center gap-0.5">
                                <span>${val}</span>
                                ${showBadge ? unverifiedBadge : ''}
                            </div>
                        </td>`;
                    }).join('')}
                </tr>
            `).join('');

            container.innerHTML = `
                <table class="border-collapse text-left w-full">
                    <thead>
                        <tr>
                            <th class="p-3 bg-slate-100 border border-slate-200 text-xs sm:text-sm sticky left-0 z-10">항목</th>
                            ${headerCells}
                        </tr>
                    </thead>
                    <tbody>
                        ${bodyRows}
                    </tbody>
                </table>
            `;
        };

        // Read the vehicles selected on the main page (handed off via sessionStorage) and render
        window.addEventListener('DOMContentLoaded', () => {
            let selectedVehicles = [];
            try {
                const raw = sessionStorage.getItem('specCompareVehicles');
                if (raw) selectedVehicles = JSON.parse(raw);
            } catch (err) {
                console.warn('[Spec Compare] 저장된 선택 차량 데이터를 불러오지 못했습니다.', err);
            }
            window.renderSpecCompareTable(selectedVehicles);
        });
    </script>
</body>
</html>
