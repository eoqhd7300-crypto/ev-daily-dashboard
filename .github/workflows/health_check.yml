name: Dashboard Health Check

# data.json의 항목별 갱신 상태(status)를 점검해, 24~36시간 이상 갱신이 멈춘 카드/목록이 있으면 GitHub Issue를 만들어
# 이메일 알림을 보낸다. update_dashboard.py는 단계가 실패해도 어제 데이터를 유지하고 워크플로우를 "성공"으로 끝내므로
# 이 점검이 없으면 정체를 알 수 없다. Gemini/외부 API를 호출하지 않아 할당량을 소모하지 않는다.
on:
  # 매일 데이터 갱신이 끝난 직후 점검 (갱신이 실제로 성공했는지가 아니라 완료 여부와 무관하게 data.json 상태를 점검)
  workflow_run:
    workflows: ["Daily EV Dashboard Auto Update"]
    types: [completed]
  # 갱신 워크플로우 자체가 실행되지 않은 경우를 잡기 위한 보험: 매일 20:30 KST (UTC 11:30)
  schedule:
    - cron: '30 11 * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: '테스트 알림 - 실제 정체가 없어도 알림 이슈를 만들어 이메일이 오는지 확인합니다 (다음 정상 점검 때 자동으로 닫힙니다)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: dashboard-health-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Check data.json status
        id: health
        run: |
          if [ "${{ github.event.inputs.test_alert }}" = "true" ]; then
            python3 check_health.py --test-alert
          else
            python3 check_health.py
          fi

      - name: Create / update / close alert issue
        uses: actions/github-script@v7
        env:
          HAS_ALERT: ${{ steps.health.outputs.has_alert }}
          SIGNATURE: ${{ steps.health.outputs.signature }}
          ALERT_COUNT: ${{ steps.health.outputs.alert_count }}
          IS_TEST: ${{ github.event.inputs.test_alert }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const label = 'stale-alert';
            const hasAlert = process.env.HAS_ALERT === 'true';
            const signature = process.env.SIGNATURE || '';
            const isTest = process.env.IS_TEST === 'true';
            const report = fs.readFileSync('health_report.md', 'utf8');
            const marker = `<!-- signature:${signature} -->`;

            // 라벨이 없으면 만든다
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (e) {
              await github.rest.issues.createLabel({
                owner, repo, name: label, color: 'd93f0b',
                description: 'EV 대시보드 데이터 갱신 정체 알림 (자동 생성/종료)',
              });
            }

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: label, per_page: 20,
            });
            const existing = openIssues[0];

            if (hasAlert) {
              const title = isTest
                ? '[테스트] EV 대시보드 데이터 정체 알림'
                : `EV 대시보드 데이터 갱신 정체 감지 (${process.env.ALERT_COUNT}개 항목)`;
              // 저장소 소유자를 담당자로 지정하고 @멘션해 알림 메일이 확실히 가도록 한다
              const body = `@${owner}\n\n${report}\n${marker}`;
              if (!existing) {
                await github.rest.issues.create({
                  owner, repo, title, body, labels: [label], assignees: [owner],
                });
                core.info('알림 이슈를 새로 만들었습니다.');
              } else if (!(existing.body || '').includes(marker)) {
                // 정체 항목 구성이 바뀐 경우에만 댓글로 알린다 (같은 문제로 매일 메일이 오지 않도록)
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, title, body });
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: `@${owner} 정체 항목 구성이 바뀌었습니다.\n\n${report}`,
                });
                core.info('정체 항목 구성이 바뀌어 이슈를 갱신했습니다.');
              } else {
                core.info('같은 정체 상태의 열린 이슈가 이미 있어 추가 알림을 보내지 않습니다.');
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `@${owner} 모든 항목이 정상으로 돌아와 이 알림을 자동으로 닫습니다.\n\n${report}`,
              });
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
              core.info('정상 복구되어 알림 이슈를 닫았습니다.');
            } else {
              core.info('정체 항목이 없습니다.');
            }
