name: Daily EV Dashboard Auto Update

on:
  schedule:
    # 매일 KST 오전 9시 10분 (UTC 00:10) 자동 실행
    # 주의: GitHub Actions는 매 정시(0분)에 예약된 워크플로우가 몰려 지연되는 경우가 많아
    # 정시(0분)를 피해 10분으로 오프셋을 두어 실행 지연 가능성을 낮춥니다.
    - cron: '10 0 * * *'
  workflow_dispatch: # Actions 탭에서 수동 실행 버튼 활성화

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Script & Regenerate data.json
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_dashboard.py

      - name: Commit and Push data.json
        run: |
          if [ ! -f data.json ]; then
            echo "data.json이 생성되지 않아 커밋을 건너뜁니다 (예: Gemini API 할당량 초과)."
            exit 0
          fi
          git config --global user.name "EV-Dashboard-Bot"
          git config --global user.email "bot@github.com"
          git add data.json
          git commit -m "Auto Update: Daily EV Dashboard Data [$(date +'%Y-%m-%d')]" || echo "No changes to commit"
          git push

