name: Daily EV Dashboard Auto Update

on:
  schedule:
    # 매일 KST 오전 10시 30분 (UTC 01:30) 자동 실행.
    # 기존 KST 09:10 설정은 GitHub Actions 스케줄 지연으로 실제로는 거의 매일 KST 오후 1~3시에
    # 실행되어, Gemini API가 반복적으로 503(서버 과부하)을 반환하는 시간대와 겹쳤다. 10:30으로
    # 당겨 실제 실행 시간대를 오전~점심 쪽으로 옮겨 그 혼잡 구간을 피해본다(절대적 보장은 아님).
    # 정시(0분)를 피해 30분으로 오프셋을 두어 실행 지연 가능성을 낮춥니다.
    - cron: '30 1 * * *'
  workflow_dispatch: # Actions 탭에서 수동 실행 버튼 활성화
    inputs:
      force_patent_refresh:
        description: '특허 동향(BigQuery) 강제 갱신 - 체크 시 요일과 무관하게 즉시 조회'
        required: false
        default: false
        type: boolean
      force_full_refresh:
        description: '오늘 이미 갱신 이력이 있어도 강제로 다시 실행 (기본은 같은 날 중복 실행을 건너뜀 - API 할당량 절약)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    # Gemini 503 재시도 설정(60초 대기 x 최대 2회)을 늘리면서, 여러 호출이 동시에 재시도에 걸릴 때
    # 기존 20분으로는 중간에 강제 종료될 위험이 있어 25분으로 늘렸다 (RSS 수집량 증가분 포함 안전장치).
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Script & Regenerate data.json
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_SA_KEY_JSON: ${{ secrets.GCP_SA_KEY_JSON }}
          FORCE_PATENT_REFRESH: ${{ github.event.inputs.force_patent_refresh }}
          FORCE_FULL_REFRESH: ${{ github.event.inputs.force_full_refresh }}
        run: python update_dashboard.py

      - name: Commit and Push data.json
        run: |
          if [ ! -f data.json ]; then
            echo "data.json이 생성되지 않아 커밋을 건너뜁니다 (예: Gemini API 할당량 초과)."
            exit 0
          fi
          git config --global user.name "EV-Dashboard-Bot"
          git config --global user.email "bot@github.com"
          git add data.json
          git commit -m "Auto Update: Daily EV Dashboard Data [$(date +'%Y-%m-%d')]" || echo "No changes to commit"
          git push

